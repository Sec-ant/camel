[package]
name = "camel-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[[bin]]
name = "camel"
path = "src/main.rs"
doc = false

[dependencies]
camel = { path = "../.." }
camel-vision = { path = "../camel-vision" }
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
anyhow = "1"
tempfile = "3"
base64 = "0.22"
ring = "0.17"
tiny_http = "0.12"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints.rust]
unsafe_code = "forbid"
