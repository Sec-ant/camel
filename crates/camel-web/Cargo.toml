[package]
name = "camel-web"
description = "WebAssembly bindings for the Camel proofreading workbench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
camel.workspace = true
camel-project.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
camel-vision.workspace = true
js-sys = { workspace = true, features = ["std"] }
wasm-bindgen = { workspace = true, features = ["std"] }
wasm-bindgen-futures = { workspace = true, features = ["std"] }

[lints]
workspace = true
