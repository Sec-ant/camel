[package]
name = "camel-vision"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
camel = { path = "../.." }
image = { version = "0.25.10", default-features = false }
rten = { version = "0.26.0", default-features = false, features = ["onnx_format"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
